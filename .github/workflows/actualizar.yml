name: Actualizar Enlace M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Playwright y dependencias
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Ejecutar script con Navegador (Playwright)
        env:
          GIST_ID: "${{ secrets.GIST_ID }}"
          GH_TOKEN: "${{ secrets.GH_TOKEN }}"
          WEB_URL: "https://tecnotv.club/"
        run: |
          python -c "
          import os
          import re
          from playwright.sync_api import sync_playwright
          import requests

          web_url = os.environ['WEB_URL']
          gist_id = os.environ['GIST_ID']
          token = os.environ['GH_TOKEN']

          print('Abriendo navegador headless...')
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(web_url, timeout=60000)
              
              # Esperamos a que cargue el contenido dinámico de la página
              page.wait_for_timeout(5000)
              
              # Obtenemos todo el HTML ya renderizado con JavaScript ejecutado
              html_content = page.content()
              browser.close()

          # Buscamos el enlace con la estructura de la lista
          match = re.search(r'https?://[^\s\"\'<>]+/[a-zA-Z0-9]{4}/lista4\.m3u', html_content)

          if match:
              nuevo_enlace = match.group(0)
              print(f'¡Enlace encontrado con éxito!: {nuevo_enlace}')

              gist_url = f'https://api.github.com/gists/{gist_id}'
              headers_gist = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json'
              }
              data = {
                  'files': {
                      'lista.m3u': {
                          'content': nuevo_enlace
                      }
                  }
              }
              r = requests.patch(gist_url, json=data, headers=headers_gist)
              if r.status_code == 200:
                  print('¡Gist actualizado con éxito!')
              else:
                  print(f'Error al actualizar Gist: {r.status_code}')
          else:
              print('No se pudo encontrar el enlace ni siquiera con el navegador.')
          "
