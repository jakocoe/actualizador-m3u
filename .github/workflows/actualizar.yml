name: Actualizar Enlace M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Ejecutar script de diagnóstico
        env:
          GIST_ID: "${{ secrets.GIST_ID }}"
          GH_TOKEN: "${{ secrets.GH_TOKEN }}"
          WEB_URL: "https://tecnotv.club/"
        run: |
          python -c "
          import os
          import re
          import requests

          web_url = os.environ['WEB_URL']
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          
          try:
              response = requests.get(web_url, headers=headers)
              print(f'Estado HTTP: {response.status_code}')
              html_content = response.text
              
              # Buscamos cualquier ocurrencia de tecnotv.club para ver qué trae la página
              matches = re.findall(r'https?://[^\s\"<>]+', html_content)
              print(f'Total de enlaces encontrados en HTML bruto: {len(matches)}')
              
              # Intentar buscar el patrón específico de la lista
              match = re.search(r'https?://[^\s\"\'<>]+/[a-zA-Z0-9]{4}/lista4\.m3u', html_content)
              
              if match:
                  nuevo_enlace = match.group(0)
                  print(f'¡Encontrado con éxito!: {nuevo_enlace}')
              else:
                  print('El HTML bruto no muestra el enlace directo (posible carga por JavaScript).')
                  # Imprimir parte del texto para inspección
                  print(html_content[:500])
          except Exception as e:
              print(f'Error al conectar: {e}')
          "
